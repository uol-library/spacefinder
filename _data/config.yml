##########################################################################
# Map starting location and zoom level
##########################################################################
map:
  startLat: 53.806529
  startLng: -1.555291
  startZoom: 16
##########################################################################
# Routing
#
# How places and pages are shown in URLs:
#   history: URLs like /cafes/courtyard-coffee (uses the History API).
#            Direct visits to these URLs need the server to send the
#            site's index page (e.g. with Apache rewrite rules in
#            .htaccess). If it can't, 404.html redirects to the site and
#            the URL is restored, which works on GitHub Pages.
#   hash:    URLs like /#/cafes/courtyard-coffee. Works on any static
#            host with no server configuration.
##########################################################################
routing: "hash"
##########################################################################
# Datasets
#
# Each dataset is a folder in assets/data named after its key, containing:
#   data.json:    an array of schema.org JSON-LD records
#   filters.json: filter definitions
#   <key>.mjs:    a module which renders the data (see cafes/cafes.mjs)
#   images/:      any images the data refers to (optional)
#
# The key is also used in URLs, e.g. /cafes/courtyard-coffee. The first
# dataset is the one shown when the site is opened. The datasets here are
# examples: a site using the theme lists its own in its _data/config.yml.
#
# Each dataset has the following properties:
#   key:   folder name and URL path
#   label: human readable name, used in the interface
#   name:  name used in sentences, e.g. "List of cafés" (optional,
#          defaults to the label in lower case)
#   icon:  icon class used for the dataset in the interface
##########################################################################
datasources:
  - key: "cafes"
    label: "Cafés"
    icon: "icon-coffee"
  - key: "trees"
    label: "Trees"
    icon: "icon-views"
